# El plan gratuito de Render suspende el servicio tras 15 min sin tráfico
# (la primera visita tarda ~50 s en despertar). Este job lo visita cada 10 min.
name: Mantener activo el sitio
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar /api/health
        run: curl -fsS --retry 3 --max-time 90 https://autosubasta-gt.onrender.com/api/health
